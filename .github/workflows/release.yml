name: Release

on:
  push:
    tags:
      - 'v*'

jobs:

  # ── Gate: full build + test must pass before anything is published ──────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test (including license check)
        run: mvn clean verify -B -P license

  # ── Publish to Maven Central and create GitHub release ─────────────────────
  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release          # enables required-reviewer protection rules
    permissions:
      contents: write             # needed to create the GitHub release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-username: MAVEN_USER
          server-password: MAVEN_PW
          server-id: central

      - name: Install Maven 3.9.16 for Central publishing
        # central-publishing-maven-plugin 0.11.0 currently bundles stray
        # local-repository files under Maven 3.10.x, which Central rejects.
        run: |
          MAVEN_VERSION=3.9.16
          MAVEN_SHA512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
          MAVEN_ARCHIVE="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl -fsSL -o "$MAVEN_ARCHIVE" "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          echo "$MAVEN_SHA512  $MAVEN_ARCHIVE" | sha512sum -c -
          tar -xzf "$MAVEN_ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
          echo "MAVEN_HOME=$RUNNER_TEMP/apache-maven-$MAVEN_VERSION" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin/mvn" -version

      - name: Import GPG private key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          # Enable loopback pinentry so the passphrase can be injected
          # non-interactively without a running gpg-agent prompt
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "$MAVEN_GPG_KEY" | gpg --batch --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "$fingerprint:6:" | gpg --batch --import-ownertrust
        env:
          MAVEN_GPG_KEY: ${{ secrets.GPG_SECRET_KEY }}

      - name: Deploy to Maven Central
        # assembly:single is called explicitly because the assembly plugin has
        # no lifecycle binding in the POM; -Prelease activates signing + publishing
        run: mvn clean deploy -B -Prelease assembly:single
        env:
          MAVEN_USER: ${{ secrets.SONATYPE_USER }}
          MAVEN_PW: ${{ secrets.SONATYPE_PWD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SECRET_KEY_PASSPHRASE }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/*.zip
            target/*cyclonedx.json
            target/*cyclonedx.xml
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true  # auto-generates notes from merged PRs / commits
